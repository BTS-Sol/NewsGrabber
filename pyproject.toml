[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newsgrabber"
version = "1.0.0"
description = "Modularer News-Grabber: tägliches Morgenbriefing aus seriösen Quellen als Markdown, HTML und JSON"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietär" }
dependencies = [
    "requests>=2.31",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "snowballstemmer>=2.2",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
claude = ["anthropic>=1.14"]
browser = ["playwright>=1.45"]
alle = ["anthropic>=1.14", "playwright>=1.45"]
test = ["pytest>=7"]

[project.scripts]
newsgrabber = "newsgrabber.cli:main"

[tool.setuptools.packages.find]
include = ["newsgrabber*"]

[tool.setuptools.package-data]
newsgrabber = ["resources/*.yaml", "report/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
